<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LiftLog</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
input,button,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;-webkit-user-select:none;user-select:none}

:root{
  --bg:#141414;--surface:#1e1e1e;--elevated:#272727;--border:#333;
  --text:#e0e0e0;--text2:#6a6a6a;
  --accent:#d45018;--accent-faint:rgba(212,80,24,.1);
  --danger:#d94545;
  --shadow:0 1px 8px rgba(0,0,0,.55);
  --c-push:#d94545;--c-pull:#4a80c4;--c-legs:#9460c8;--c-sup:#4a9e4a;
  --font:system-ui,-apple-system,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
select option{background:var(--elevated);color:var(--text)}

/* ── LAYOUT ── */
#onboarding{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#onboarding.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto}
#content{flex:1;overflow:hidden;position:relative}
.tab{position:absolute;inset:0;overflow-y:auto;padding:16px 16px 20px;display:none;flex-direction:column;-webkit-overflow-scrolling:touch}
.tab.active{display:flex}

/* ── NAVBAR ── */
#navbar{display:flex;height:60px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;color:var(--text2);transition:color .15s;padding:0}
.nav-btn.active{color:var(--accent)}
.nav-btn svg,.nav-btn i{width:22px;height:22px;display:block}
.nav-btn span{font-size:10px;font-weight:600;letter-spacing:.3px}
.nav-btn.session-active::after{content:'';position:absolute;top:7px;right:calc(50% - 14px);width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse-dot 1.4s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* ── SHARED COMPONENTS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 20px;border-radius:10px;font-weight:600;font-size:15px;transition:all .15s;letter-spacing:.1px}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:active{opacity:.82}
.btn-accent:disabled{opacity:.32;pointer-events:none}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:active{opacity:.82}
.btn-outline{border:1px solid var(--border);color:var(--text2)}
.btn-outline:active{background:var(--elevated)}
.btn-ghost{color:var(--text2);padding:8px 12px;min-height:38px}
.btn-sm{min-height:38px;padding:8px 14px;font-size:14px;border-radius:8px}
.input{width:100%;min-height:44px;padding:10px 12px;background:var(--elevated);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;transition:border-color .2s}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text2)}
.hidden{display:none!important}
.select-wrap{position:relative}
.select-wrap select{width:100%;min-height:44px;padding:10px 12px;background:var(--elevated);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;appearance:none;-webkit-appearance:none}
.select-wrap::after{content:'▾';position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--text2);pointer-events:none;font-size:13px}
.sec-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}

/* ── ONBOARDING ── */
.ob-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:20px}
.ob-title{font-size:38px;font-weight:800;color:var(--accent);text-align:center;letter-spacing:-1px}
.ob-sub{color:var(--text2);font-size:14px;text-align:center;margin-top:-8px}
.unit-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.unit-btn{flex:1;min-height:42px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;transition:all .2s;background:var(--elevated);color:var(--text2)}
.unit-btn.active{background:var(--accent);color:#fff}

/* ── HOME ── */
.cat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin:14px 0 6px;padding-left:2px}
.cat-label:first-child{margin-top:2px}
.group-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--cat-color,var(--border));border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:background .15s,border-color .15s;position:relative;-webkit-tap-highlight-color:transparent}
.group-card.selected{border-color:var(--cat-color)!important;background:var(--sel-bg,var(--accent-faint))}
.group-card.done{opacity:.38;pointer-events:none}
.group-card.locked{pointer-events:none}
.group-header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.group-name{font-weight:700;font-size:16px;line-height:1.2}
.group-exs{margin-top:5px;font-size:13px;color:var(--text2);line-height:1.5}
.hit-ring{width:34px;height:34px;min-width:34px;border-radius:50%;border:2.5px solid var(--border);flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hit-ring.h1{border-color:var(--accent)}
.hit-ring.h1::before{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:var(--accent)}
.hit-ring.h2{border-color:var(--accent);background:var(--accent)}
.hit-ring.h2 .ck{position:relative;z-index:1;color:#fff;font-size:14px;font-weight:700}
.start-bar{padding-top:10px;flex-shrink:0;margin-top:auto;position:sticky;bottom:0;background:var(--bg)}
.banner{background:var(--elevated);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.banner-ttl{font-weight:700;font-size:15px;margin-bottom:10px}
.banner-btns{display:flex;gap:8px}
.today-msg{text-align:center;color:var(--text2);font-size:13px;padding:10px 0 4px;font-weight:500}

/* ── EDIT ── */
.cat-section{margin-bottom:4px}
.cat-hdr{display:flex;align-items:center;gap:7px;padding:10px 0 5px}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-hdr-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.edit-group-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--cat-color,var(--border));border-radius:12px;padding:14px;margin-bottom:10px}
.edit-group-name{font-weight:700;font-size:15px;margin-bottom:10px;color:var(--text)}
.edit-ex-wrap{background:var(--elevated);border-radius:10px;padding:10px 10px 8px;margin-bottom:8px}
.edit-ex-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.edit-ex-row .input{min-height:38px;padding:8px 10px;flex:1;font-size:14px;background:var(--bg);border-radius:8px}
.sets-input{width:56px!important;min-width:56px;flex:none!important;text-align:center}
.ex-del{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--danger);font-size:18px;border-radius:8px;flex-shrink:0;opacity:.7}
.ex-del:active{background:rgba(217,69,69,.15);opacity:1}
.also-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px;min-height:22px}
.also-lbl{color:var(--text2);font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
.also-chip{background:var(--accent);color:#fff;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;transition:opacity .1s}
.also-chip:active{opacity:.75}
.tag-add-btn{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;padding-bottom:1px}
.tag-picker{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
.picker-chip{border:1px solid var(--border);color:var(--text2);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;transition:all .12s}
.picker-chip.selected{background:var(--accent);border-color:var(--accent);color:#fff}
.add-ex-btn{font-size:13px;color:var(--accent);padding:6px 0;min-height:30px;font-weight:600}
.edit-footer{padding-top:10px;flex-shrink:0;margin-top:auto;position:sticky;bottom:0;background:var(--bg)}

/* ── WORKOUT ── */
.gym-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-shrink:0}
.gym-timer{font-variant-numeric:tabular-nums;color:var(--accent);font-size:18px;font-weight:700}
.gym-group-hdr{font-weight:700;font-size:17px;margin:18px 0 10px;padding-bottom:8px;border-bottom:1px solid}
.gym-group-hdr:first-child{margin-top:0}
.gym-ex-block{margin-bottom:18px}
.gym-ex-name{font-weight:600;font-size:14px;margin-bottom:3px;color:var(--text2);text-transform:lowercase}
.gym-ex-also{font-size:11px;color:var(--text2);opacity:.55;margin-bottom:7px}
.set-row{display:flex;align-items:center;gap:4px;margin-bottom:5px}
.set-num{width:40px;min-width:40px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text2);font-size:12px;background:var(--elevated);border-radius:8px;flex-shrink:0}
.set-input{flex:1;min-width:0;height:36px;padding:6px 4px;background:var(--elevated);border:1px solid var(--border);border-radius:8px;text-align:center;font-size:14px;font-weight:600}
.set-input:focus{border-color:var(--accent)}
.set-input.done{background:var(--accent-faint);border-color:var(--accent);color:var(--accent)}
.set-check{width:36px;min-width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px;border:2px solid var(--border);transition:all .18s;color:var(--text2);flex-shrink:0}
.set-check.done{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Rest picker */
.rest-picker{background:var(--elevated);border-radius:10px;padding:10px;margin:3px 0 8px}
.rest-picker-lbl{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}
.rest-picker-opts{display:flex;gap:5px;flex-wrap:wrap}
.rest-picker-opt{flex:1;min-width:44px;min-height:32px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:var(--text2);background:var(--bg);transition:all .12s}
.rest-picker-opt:active{background:var(--elevated)}
.rest-picker-opt.is-default{border-color:var(--accent);color:var(--accent)}
/* Rest running */
.rest-inline{background:var(--elevated);border-radius:10px;padding:10px 12px;margin:3px 0 8px}
.rest-inline-row{display:flex;align-items:center;justify-content:space-between}
.rest-time{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.rest-lbl{font-size:11px;color:var(--text2);margin-bottom:1px}
.rest-action-btns{display:flex;gap:6px}
.rest-act-btn{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--text2)}
.rest-act-btn:active{background:var(--elevated)}
.gym-actions{display:flex;gap:16px;margin-top:2px}
.gym-act-btn{font-size:13px;color:var(--accent);padding:4px 0;min-height:28px;font-weight:600}
.gym-act-btn.danger{color:var(--danger)}
.no-session{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto}

/* ── STATS ── */
.stats-hdr{font-size:20px;font-weight:700;margin-bottom:14px;flex-shrink:0}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;overflow:hidden}
.chart-ttl{font-size:12px;font-weight:600;margin-bottom:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart-scroll svg{display:block}
.summary-table{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.summary-row:last-child{border-bottom:none}

/* ── SETTINGS ── */
.settings-hdr{font-size:20px;font-weight:700;margin-bottom:16px}
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>

<!-- ── ONBOARDING ── -->
<div id="onboarding">
  <div class="ob-card">
    <div class="ob-title">LiftLog</div>
    <div class="ob-sub">Your personal gym companion</div>
    <div>
      <div class="sec-label" style="margin-bottom:8px">Your Name</div>
      <input class="input" id="obName" placeholder="e.g. Barjinder" autocomplete="given-name">
    </div>
    <div>
      <div class="sec-label" style="margin-bottom:8px">Units</div>
      <div class="unit-toggle">
        <button class="unit-btn active" data-unit="lbs" onclick="obUnit('lbs')">LBS</button>
        <button class="unit-btn" data-unit="kg" onclick="obUnit('kg')">KG</button>
      </div>
    </div>
    <button class="btn btn-accent" style="width:100%" onclick="finishOnboarding()">Get Started</button>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <div id="content">
    <div class="tab" id="tab-home"></div>
    <div class="tab" id="tab-edit"></div>
    <div class="tab" id="tab-workout"></div>
    <div class="tab" id="tab-stats"></div>
    <div class="tab" id="tab-settings"></div>
  </div>
  <nav id="navbar">
    <button class="nav-btn" data-tab="home" onclick="switchTab('home')">
      <i data-lucide="home"></i>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-tab="edit" onclick="switchTab('edit')">
      <i data-lucide="pencil"></i>
      <span>Edit</span>
    </button>
    <button class="nav-btn" data-tab="workout" onclick="switchTab('workout')">
      <i data-lucide="dumbbell"></i>
      <span>Workout</span>
    </button>
    <button class="nav-btn" data-tab="stats" onclick="switchTab('stats')">
      <i data-lucide="bar-chart-2"></i>
      <span>Stats</span>
    </button>
    <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">
      <i data-lucide="settings"></i>
      <span>Settings</span>
    </button>
  </nav>
</div>

<script>
// ════════════════════════════════════════════
//  CONSTANTS
// ════════════════════════════════════════════
const GROUP_CATEGORIES = [
  { label: 'Push',       groups: ['Chest', 'Shoulders', 'Triceps'] },
  { label: 'Pull',       groups: ['Lats', 'Upper Back', 'Lower Back', 'Biceps'] },
  { label: 'Legs',       groups: ['Quads', 'Hamstrings', 'Calves'] },
  { label: 'Supporters', groups: ['Core', 'Forearms'] }
];
const CAT_COLORS = { Push: '#d94545', Pull: '#4a80c4', Legs: '#9460c8', Supporters: '#4a9e4a' };
const ALL_GROUPS = GROUP_CATEGORIES.flatMap(c => c.groups);
const REST_OPTIONS = [
  { label: '30s',   sec: 30  },
  { label: '45s',   sec: 45  },
  { label: '1min',  sec: 60  },
  { label: '1m30s', sec: 90  },
  { label: '2min',  sec: 120 },
  { label: '2m30s', sec: 150 }
];

// ════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════
function load(k, d)   { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v)   { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function uid()        { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s)       { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
function today()      { return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
function getSunday()  { const d = today(); const dt = new Date(d + 'T12:00:00'); dt.setDate(dt.getDate() - dt.getDay()); return dt.toISOString().slice(0, 10); }

function getCat(g)    { for (const c of GROUP_CATEGORIES) if (c.groups.includes(g)) return c.label; return 'Supporters'; }
function getColor(g)  { return CAT_COLORS[getCat(g)] || '#6a6a6a'; }
function hexFaint(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function restLabelToSec(label) {
  const opt = REST_OPTIONS.find(r => r.label === label);
  return opt ? opt.sec : 60;
}

// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
let settings     = load('settings', { name: '', unit: 'lbs', defaultRest: '1min' });
if (!settings.defaultRest) settings.defaultRest = '1min';

let muscleGroups = load('muscle_groups', null);
let workouts     = load('workouts', []);
let activeWorkout= load('active_workout', null);
let lastFinished = load('last_finished', null);
let selectedGroups = new Set();
let gymTimerInterval  = null;
let gymPersistInterval= null;
let restTimers   = {};
let curStatsGroup= null;
let obUnitVal    = settings.unit || 'lbs';

// init muscle groups
if (!muscleGroups) {
  muscleGroups = {};
  ALL_GROUPS.forEach(g => { muscleGroups[g] = { exercises: [], hits: 0, weekStart: getSunday() }; });
  save('muscle_groups', muscleGroups);
}
// migration
ALL_GROUPS.forEach(g => {
  if (!muscleGroups[g]) muscleGroups[g] = { exercises: [], hits: 0, weekStart: getSunday() };
  if (!Array.isArray(muscleGroups[g].exercises)) muscleGroups[g].exercises = [];
  muscleGroups[g].exercises.forEach(ex => { if (!ex.alsoCountsFor) ex.alsoCountsFor = []; });
});

function checkWeekReset() {
  const sun = getSunday(); let changed = false;
  ALL_GROUPS.forEach(g => {
    if (muscleGroups[g] && muscleGroups[g].weekStart !== sun) {
      muscleGroups[g].hits = 0; muscleGroups[g].weekStart = sun; changed = true;
    }
  });
  if (changed) save('muscle_groups', muscleGroups);
}

// ════════════════════════════════════════════
//  ONBOARDING
// ════════════════════════════════════════════
function obUnit(u) {
  obUnitVal = u;
  document.querySelectorAll('#onboarding .unit-btn').forEach(b => b.classList.toggle('active', b.dataset.unit === u));
}
function finishOnboarding() {
  const name = document.getElementById('obName').value.trim();
  if (!name) { document.getElementById('obName').focus(); return; }
  settings.name = name; settings.unit = obUnitVal; settings.defaultRest = '1min';
  save('settings', settings);
  localStorage.setItem('onboarded', 'true');
  document.getElementById('onboarding').classList.add('hidden');
  switchTab('home');
}

// ════════════════════════════════════════════
//  TAB ROUTING
// ════════════════════════════════════════════
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById('tab-' + name);
  if (tab) tab.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  updateWorkoutBtn();
  if      (name === 'home')     renderHome();
  else if (name === 'edit')     renderEdit();
  else if (name === 'workout')  renderWorkout();
  else if (name === 'stats')    renderStats();
  else if (name === 'settings') renderSettings();
  lucide.createIcons();
}
function updateWorkoutBtn() {
  const btn = document.querySelector('.nav-btn[data-tab="workout"]');
  if (btn) btn.classList.toggle('session-active', !!activeWorkout);
}

// ════════════════════════════════════════════
//  HOME
// ════════════════════════════════════════════
function renderHome() {
  checkWeekReset();
  selectedGroups.clear();
  const td = today();
  const workedOutToday = !activeWorkout && workouts.some(w => w.date === td);
  let h = '';

  if (activeWorkout) {
    h += `<div class="banner" style="border-color:var(--accent)">
      <div class="banner-ttl" style="color:var(--accent)">You have an unfinished workout</div>
      <div class="banner-btns">
        <button class="btn btn-accent btn-sm" style="flex:1" onclick="continueWorkout()">Continue</button>
        <button class="btn btn-sm" style="flex:1;border:1px solid var(--danger);color:var(--danger)" onclick="discardWorkout()">Discard</button>
      </div>
    </div>`;
  }

  if (!activeWorkout && lastFinished && workouts.some(w => w.id === lastFinished.savedWorkoutId && w.date === td)) {
    h += `<div class="banner">
      <div class="banner-ttl">Did you finish?</div>
      <div class="banner-btns">
        <button class="btn btn-accent btn-sm" style="flex:1" onclick="resumeLastWorkout()">Continue</button>
        <button class="btn btn-sm btn-outline" style="flex:1" onclick="dismissUnfinished()">Done</button>
      </div>
    </div>`;
  }

  if (workedOutToday) {
    h += `<div class="today-msg">Already trained today. Rest up.</div>`;
  }

  GROUP_CATEGORIES.forEach(cat => {
    const color = CAT_COLORS[cat.label];
    h += `<div class="cat-label" style="color:${color}">${cat.label}</div>`;
    cat.groups.forEach(g => {
      const mg    = muscleGroups[g] || { exercises: [], hits: 0 };
      const hits  = mg.hits || 0;
      const noEx  = !mg.exercises.length;
      const done  = hits >= 2;
      const blocked = done || workedOutToday || noEx || !!activeWorkout;
      const hCls  = hits >= 2 ? 'h2' : hits === 1 ? 'h1' : '';
      const ck    = hits >= 2 ? '<span class="ck">✓</span>' : '';
      const selBg = hexFaint(color, .09);
      const exText = mg.exercises.length
        ? mg.exercises.map(e => esc(e.name)).join(', ')
        : '<span style="font-style:italic;opacity:.45">No exercises added</span>';
      const clickAttr = !blocked ? `onclick="toggleGroup(this,'${esc(g)}','${color}','${selBg}')"` : '';
      h += `<div class="group-card${done ? ' done' : (workedOutToday && !activeWorkout) || (noEx && !done) ? ' locked' : ''}"
              style="--cat-color:${color}"
              ${clickAttr}>
        <div class="group-header">
          <div style="flex:1;min-width:0">
            <div class="group-name">${esc(g)}</div>
            <div class="group-exs">${exText}</div>
          </div>
          <div class="hit-ring ${hCls}">${ck}</div>
        </div>
      </div>`;
    });
  });

  h += `<div class="start-bar">
    <button class="btn btn-accent" style="width:100%" id="startBtn" disabled onclick="startGym()">Select at least 2 groups</button>
  </div>`;

  document.getElementById('tab-home').innerHTML = h;
  updateStartBtn();
  if (workedOutToday || activeWorkout) {
    const sb = document.getElementById('startBtn');
    if (sb) sb.style.display = 'none';
  }
}

function toggleGroup(el, g, color, selBg) {
  if (selectedGroups.has(g)) {
    selectedGroups.delete(g);
    el.classList.remove('selected');
    el.style.removeProperty('--sel-bg');
  } else {
    if (selectedGroups.size >= 5) return;
    selectedGroups.add(g);
    el.classList.add('selected');
    el.style.setProperty('--sel-bg', selBg);
  }
  updateStartBtn();
}

function updateStartBtn() {
  const btn = document.getElementById('startBtn');
  if (!btn) return;
  const n = selectedGroups.size;
  btn.disabled = n < 2;
  btn.textContent = n >= 2 ? `Start Workout  (${n}/5 groups)` : 'Select at least 2 groups';
}

// ════════════════════════════════════════════
//  EDIT
// ════════════════════════════════════════════
function renderEdit() {
  let h = '';
  GROUP_CATEGORIES.forEach(cat => {
    const color = CAT_COLORS[cat.label];
    h += `<div class="cat-section">
      <div class="cat-hdr">
        <div class="cat-dot" style="background:${color}"></div>
        <span class="cat-hdr-lbl" style="color:${color}">${cat.label}</span>
      </div>`;
    cat.groups.forEach(g => {
      const mg = muscleGroups[g] || { exercises: [] };
      h += `<div class="edit-group-card" style="--cat-color:${color}" data-group="${esc(g)}">
        <div class="edit-group-name">${esc(g)}</div>
        <div class="edit-ex-list">`;
      mg.exercises.forEach(ex => {
        h += editExHTML(g, ex.name, ex.sets || 3, ex.alsoCountsFor || []);
      });
      h += `</div>
        <button class="add-ex-btn" onclick="addEditEx(this,'${esc(g)}')">+ Add Exercise</button>
      </div>`;
    });
    h += '</div>';
  });
  h += `<div class="edit-footer">
    <button class="btn btn-accent" style="width:100%" id="editSaveBtn" onclick="saveEdit()">Save Changes</button>
  </div>`;
  document.getElementById('tab-edit').innerHTML = h;
}

function editExHTML(group, name, sets, also) {
  const alsoJSON = esc(JSON.stringify(also));
  const chips = also.map(ag => `<span class="also-chip" onclick="removeAlsoTag(this,'${esc(ag)}')">${esc(ag)}</span>`).join('');
  return `<div class="edit-ex-wrap" data-primary="${esc(group.toLowerCase())}" data-also="${alsoJSON}">
    <div class="edit-ex-row">
      <input class="input" value="${esc(name)}" placeholder="Exercise name">
      <input class="input sets-input" type="number" min="1" value="${sets}" placeholder="#" data-f="sets">
      <button class="ex-del" onclick="this.closest('.edit-ex-wrap').remove()">&times;</button>
    </div>
    <div class="also-row">
      <span class="also-lbl">Also hits:</span>
      <div class="also-chips-inner" style="display:flex;flex-wrap:wrap;gap:5px;align-items:center">${chips}</div>
      <button class="tag-add-btn" onclick="openTagPicker(this)" title="Add tag">+</button>
    </div>
    <div class="tag-picker hidden"></div>
  </div>`;
}

function addEditEx(btn, g) {
  const list = btn.previousElementSibling;
  const t = document.createElement('template');
  t.innerHTML = editExHTML(g, '', 3, []);
  const el = t.content.firstChild;
  list.appendChild(el);
  el.querySelector('input').focus();
}

function openTagPicker(btn) {
  const wrap   = btn.closest('.edit-ex-wrap');
  const picker = wrap.querySelector('.tag-picker');
  if (!picker.classList.contains('hidden')) { picker.classList.add('hidden'); return; }
  const primary = wrap.dataset.primary;
  const currentAlso = JSON.parse(wrap.dataset.also || '[]');
  const others = ALL_GROUPS.filter(g => g.toLowerCase() !== primary);
  picker.innerHTML = others.map(g => {
    const gL = g.toLowerCase();
    const sel = currentAlso.includes(gL);
    return `<button class="picker-chip${sel ? ' selected' : ''}" onclick="toggleAlsoTag(this,'${gL}')">${esc(g)}</button>`;
  }).join('');
  picker.classList.remove('hidden');
}

function toggleAlsoTag(chip, gL) {
  const wrap = chip.closest('.edit-ex-wrap');
  let also = JSON.parse(wrap.dataset.also || '[]');
  if (also.includes(gL)) { also = also.filter(x => x !== gL); chip.classList.remove('selected'); }
  else                   { also.push(gL);                      chip.classList.add('selected');    }
  wrap.dataset.also = JSON.stringify(also);
  refreshAlsoChips(wrap, also);
}

function removeAlsoTag(chip, gL) {
  const wrap = chip.closest('.edit-ex-wrap');
  let also = JSON.parse(wrap.dataset.also || '[]');
  also = also.filter(x => x !== gL);
  wrap.dataset.also = JSON.stringify(also);
  refreshAlsoChips(wrap, also);
  wrap.querySelectorAll('.picker-chip').forEach(c => {
    if (c.textContent.trim().toLowerCase() === gL) c.classList.remove('selected');
  });
}

function refreshAlsoChips(wrap, also) {
  const inner = wrap.querySelector('.also-chips-inner');
  inner.innerHTML = also.map(ag => `<span class="also-chip" onclick="removeAlsoTag(this,'${esc(ag)}')">${esc(ag)}</span>`).join('');
}

function saveEdit() {
  const oldNames = {};
  ALL_GROUPS.forEach(g => {
    oldNames[g] = new Set((muscleGroups[g] || { exercises: [] }).exercises.map(e => e.name.toLowerCase()));
  });
  ALL_GROUPS.forEach(g => {
    const card = document.querySelector(`.edit-group-card[data-group="${g}"]`);
    if (!card) return;
    const exercises = [];
    card.querySelectorAll('.edit-ex-wrap').forEach(wrap => {
      const nameInput = wrap.querySelector('input:not([data-f])');
      const setsInput = wrap.querySelector('[data-f="sets"]');
      const v = nameInput.value.toLowerCase().trim();
      const also = JSON.parse(wrap.dataset.also || '[]');
      if (v) exercises.push({ name: v, sets: parseInt(setsInput.value) || 3, alsoCountsFor: also });
    });
    if (!muscleGroups[g]) muscleGroups[g] = { exercises: [], hits: 0, weekStart: getSunday() };
    muscleGroups[g].exercises = exercises;
    const newSet = new Set(exercises.map(e => e.name));
    const removed = [...oldNames[g]].filter(n => !newSet.has(n));
    if (removed.length) {
      workouts.forEach(w => {
        w.groups.forEach(wg => {
          if (wg.name === g) wg.exercises = wg.exercises.filter(e => !removed.includes(e.name.toLowerCase()));
        });
      });
      save('workouts', workouts);
    }
  });
  save('muscle_groups', muscleGroups);
  const btn = document.getElementById('editSaveBtn');
  if (btn) {
    btn.textContent = 'Saved';
    btn.style.background = 'var(--c-sup)';
    setTimeout(() => { btn.textContent = 'Save Changes'; btn.style.background = ''; }, 1300);
  }
}

// ════════════════════════════════════════════
//  WORKOUT — START
// ════════════════════════════════════════════
function startGym() {
  activeWorkout = {
    id: uid(),
    startTime: Date.now(),
    groups: [...selectedGroups].map(g => {
      const mg = muscleGroups[g] || { exercises: [] };
      return {
        name: g,
        exercises: mg.exercises.map(ex => {
          const prev = getPrevSets(g, ex.name);
          const n = prev.length || (ex.sets || 3);
          const sets = [];
          for (let i = 0; i < n; i++) sets.push({
            reps:      prev[i] ? prev[i].reps   : '',
            weight:    prev[i] ? prev[i].weight  : '',
            completed: false
          });
          return { name: ex.name, sets, alsoCountsFor: ex.alsoCountsFor || [] };
        })
      };
    })
  };
  save('active_workout', activeWorkout);
  restTimers = {};
  updateWorkoutBtn();
  switchTab('workout');
  startGymTimer();
}

function getPrevSets(group, exName) {
  const nameLow = exName.toLowerCase();
  for (let i = workouts.length - 1; i >= 0; i--) {
    for (const wg of workouts[i].groups) {
      if (wg.name !== group) continue;
      const ex = wg.exercises.find(e => e.name.toLowerCase() === nameLow);
      if (ex && ex.sets.some(s => s.completed)) return ex.sets.filter(s => s.completed);
    }
  }
  return [];
}

// ════════════════════════════════════════════
//  WORKOUT — RENDER
// ════════════════════════════════════════════
function renderWorkout() {
  const tab = document.getElementById('tab-workout');
  if (!activeWorkout) {
    tab.innerHTML = `<div class="no-session">
      <i data-lucide="dumbbell" style="width:44px;height:44px;color:var(--text2)"></i>
      <div style="color:var(--text2);font-size:14px;line-height:1.6">No active session.<br>Start one from Home.</div>
      <button class="btn btn-outline btn-sm" onclick="switchTab('home')">Go to Home</button>
    </div>`;
    lucide.createIcons();
    return;
  }

  const elapsed = Math.floor((Date.now() - activeWorkout.startTime) / 1000);
  const em = Math.floor(elapsed / 60), es = elapsed % 60;

  let h = `<div class="gym-top">
    <span style="font-weight:700;font-size:16px">Session</span>
    <span class="gym-timer" id="gymTimer">${em}:${es < 10 ? '0' : ''}${es}</span>
    <button class="btn btn-danger btn-sm" onclick="finishGym()">Finish</button>
  </div>`;

  activeWorkout.groups.forEach((grp, gi) => {
    const color = getColor(grp.name);
    h += `<div class="gym-group-hdr" style="color:${color};border-bottom-color:${color}33">${esc(grp.name)}</div>`;
    if (!grp.exercises.length) {
      h += `<div style="color:var(--text2);font-style:italic;font-size:14px;padding:6px 0 12px">No exercises — add in Edit</div>`;
    }
    grp.exercises.forEach((ex, ei) => {
      const alsoTags = (ex.alsoCountsFor || []).join(', ');
      h += `<div class="gym-ex-block">
        <div class="gym-ex-name">${esc(ex.name)}</div>
        ${alsoTags ? `<div class="gym-ex-also">also: ${esc(alsoTags)}</div>` : ''}`;
      ex.sets.forEach((s, si) => {
        const done = s.completed;
        const key  = `${gi}_${ei}_${si}`;
        h += `<div class="set-row" id="sr_${key}">
          <div class="set-num">Set ${si + 1}</div>
          <input class="set-input${done ? ' done' : ''}" type="number" min="0" placeholder="reps"
            value="${esc(String(s.reps))}" ${done ? 'readonly' : ''}
            oninput="updSet(${gi},${ei},${si},'reps',this.value)">
          <input class="set-input${done ? ' done' : ''}" type="number" min="0" step="0.5"
            placeholder="${settings.unit || 'lbs'}" value="${esc(String(s.weight))}" ${done ? 'readonly' : ''}
            oninput="updSet(${gi},${ei},${si},'weight',this.value)">
          <button class="set-check${done ? ' done' : ''}" onclick="toggleSetDone(${gi},${ei},${si})">${done ? '✓' : '○'}</button>
        </div><div id="rest_${key}"></div>`;
      });
      h += `<div class="gym-actions">
        <button class="gym-act-btn" onclick="addGymSet(${gi},${ei})">+ Set</button>
        ${ex.sets.length > 1 ? `<button class="gym-act-btn danger" onclick="removeGymSet(${gi},${ei})">− Set</button>` : ''}
      </div></div>`;
    });
  });

  tab.innerHTML = h;
  // Restore any running rest timers
  Object.keys(restTimers).forEach(key => {
    if (restTimers[key] && restTimers[key].remaining > 0) renderRestInline(key);
  });
}

function updSet(gi, ei, si, field, val) {
  const s = activeWorkout.groups[gi].exercises[ei].sets[si];
  if      (field === 'reps')   s.reps   = parseInt(val)   || 0;
  else if (field === 'weight') s.weight = parseFloat(val) || 0;
  save('active_workout', activeWorkout);
}

function toggleSetDone(gi, ei, si) {
  const s   = activeWorkout.groups[gi].exercises[ei].sets[si];
  const key = `${gi}_${ei}_${si}`;
  if (s.completed) {
    s.completed = false;
    clearRestTimer(key);
    save('active_workout', activeWorkout);
    renderWorkout();
    return;
  }
  s.completed = true;
  save('active_workout', activeWorkout);
  // Re-render just the set row state, then show rest picker
  renderWorkout();
  showRestPicker(key);
}

function addGymSet(gi, ei) {
  const ex = activeWorkout.groups[gi].exercises[ei];
  const last = ex.sets[ex.sets.length - 1];
  ex.sets.push({ reps: last ? last.reps : '', weight: last ? last.weight : '', completed: false });
  save('active_workout', activeWorkout);
  renderWorkout();
}

function removeGymSet(gi, ei) {
  const ex = activeWorkout.groups[gi].exercises[ei];
  if (ex.sets.length <= 1) return;
  clearRestTimer(`${gi}_${ei}_${ex.sets.length - 1}`);
  ex.sets.pop();
  save('active_workout', activeWorkout);
  renderWorkout();
}

// ════════════════════════════════════════════
//  REST — PICKER + TIMER
// ════════════════════════════════════════════
function showRestPicker(key) {
  const el = document.getElementById('rest_' + key);
  if (!el) return;
  const defaultLabel = settings.defaultRest || '1min';
  const opts = REST_OPTIONS.map(r =>
    `<button class="rest-picker-opt${r.label === defaultLabel ? ' is-default' : ''}"
      onclick="startRestFromPicker('${key}',${r.sec})">${r.label}</button>`
  ).join('');
  el.innerHTML = `<div class="rest-picker">
    <div class="rest-picker-lbl">Rest</div>
    <div class="rest-picker-opts">${opts}</div>
  </div>`;
  // Scroll the picker into view
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function startRestFromPicker(key, sec) {
  startRestTimer(key, sec);
}

function addRestTime(key, sec) {
  if (restTimers[key]) {
    restTimers[key].remaining += sec;
    renderRestInline(key);
  }
}

function skipRest(key) {
  clearRestTimer(key);
}

function startRestTimer(key, sec) {
  clearRestTimer(key);
  restTimers[key] = {
    remaining: sec,
    interval: setInterval(() => {
      restTimers[key].remaining--;
      if (restTimers[key].remaining <= 0) {
        clearRestTimer(key);
        try { navigator.vibrate && navigator.vibrate([100, 50, 100]); } catch {}
      } else {
        renderRestInline(key);
      }
    }, 1000)
  };
  renderRestInline(key);
}

function clearRestTimer(key) {
  if (restTimers[key] && restTimers[key].interval) clearInterval(restTimers[key].interval);
  delete restTimers[key];
  const el = document.getElementById('rest_' + key);
  if (el) el.innerHTML = '';
}

function renderRestInline(key) {
  const el = document.getElementById('rest_' + key);
  if (!el || !restTimers[key]) return;
  const s = restTimers[key].remaining;
  const m = Math.floor(s / 60), sec = s % 60;
  el.innerHTML = `<div class="rest-inline">
    <div class="rest-inline-row">
      <div>
        <div class="rest-lbl">Rest</div>
        <div class="rest-time">${m}:${sec < 10 ? '0' : ''}${sec}</div>
      </div>
      <div class="rest-action-btns">
        <button class="rest-act-btn" onclick="addRestTime('${key}',30)">+30s</button>
        <button class="rest-act-btn" onclick="skipRest('${key}')">Skip</button>
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════
//  GYM TIMER
// ════════════════════════════════════════════
function startGymTimer() {
  clearInterval(gymTimerInterval);
  clearInterval(gymPersistInterval);
  gymTimerInterval = setInterval(() => {
    const el = document.getElementById('gymTimer');
    if (!el || !activeWorkout) return;
    const s = Math.floor((Date.now() - activeWorkout.startTime) / 1000);
    const m = Math.floor(s / 60), sec = s % 60;
    el.textContent = `${m}:${sec < 10 ? '0' : ''}${sec}`;
  }, 1000);
  gymPersistInterval = setInterval(() => {
    if (activeWorkout) save('active_workout', activeWorkout);
  }, 5000);
}

// ════════════════════════════════════════════
//  FINISH
// ════════════════════════════════════════════
function finishGym() {
  if (!activeWorkout) return;
  clearInterval(gymTimerInterval);
  clearInterval(gymPersistInterval);
  Object.keys(restTimers).forEach(k => clearRestTimer(k));

  const dur = Math.floor((Date.now() - activeWorkout.startTime) / 1000);
  const w = {
    id:       activeWorkout.id,
    date:     today(),
    duration: dur,
    groups:   activeWorkout.groups.map(g => ({
      name:      g.name,
      exercises: g.exercises.map(e => ({
        name: e.name,
        sets: e.sets.map(s => ({ reps: s.reps || 0, weight: s.weight || 0, completed: s.completed }))
      }))
    }))
  };
  workouts.push(w);
  save('workouts', workouts);

  const hitsBefore = {};
  ALL_GROUPS.forEach(g => { if (muscleGroups[g]) hitsBefore[g] = muscleGroups[g].hits; });

  // Hit counting — only directly selected groups (alsoCountsFor is display-only)
  activeWorkout.groups.forEach(grp => {
    const didWork = grp.exercises.some(e => e.sets.some(s => s.completed));
    if (!didWork) return;
    if (muscleGroups[grp.name] && muscleGroups[grp.name].hits < 2) muscleGroups[grp.name].hits++;
  });
  save('muscle_groups', muscleGroups);

  lastFinished = { workout: activeWorkout, savedWorkoutId: w.id, hitsBefore };
  save('last_finished', lastFinished);
  activeWorkout = null;
  localStorage.removeItem('active_workout');
  updateWorkoutBtn();
  switchTab('home');
}

// ════════════════════════════════════════════
//  CRASH RECOVERY
// ════════════════════════════════════════════
function continueWorkout() {
  updateWorkoutBtn();
  switchTab('workout');
  startGymTimer();
}
function discardWorkout() {
  activeWorkout = null;
  localStorage.removeItem('active_workout');
  updateWorkoutBtn();
  renderHome();
}

// ════════════════════════════════════════════
//  UNFINISHED BUSINESS
// ════════════════════════════════════════════
function resumeLastWorkout() {
  if (!lastFinished) return;
  workouts = workouts.filter(w => w.id !== lastFinished.savedWorkoutId);
  save('workouts', workouts);
  Object.keys(lastFinished.hitsBefore || {}).forEach(g => {
    if (muscleGroups[g]) muscleGroups[g].hits = lastFinished.hitsBefore[g];
  });
  save('muscle_groups', muscleGroups);
  activeWorkout = lastFinished.workout;
  save('active_workout', activeWorkout);
  lastFinished = null;
  localStorage.removeItem('last_finished');
  restTimers = {};
  updateWorkoutBtn();
  switchTab('workout');
  startGymTimer();
}
function dismissUnfinished() {
  lastFinished = null;
  localStorage.removeItem('last_finished');
  renderHome();
}

// ════════════════════════════════════════════
//  STATS
// ════════════════════════════════════════════
function renderStats() {
  checkWeekReset();
  const tab = document.getElementById('tab-stats');
  const groupsWithData = ALL_GROUPS.filter(gn =>
    workouts.some(w => w.groups.some(wg => wg.name === gn && wg.exercises.some(e => e.sets.some(s => s.completed))))
  );
  if (!groupsWithData.length) {
    tab.innerHTML = `<div class="stats-hdr">Stats</div>
      <div style="color:var(--text2);text-align:center;padding:60px 0 0;font-size:14px;line-height:1.8">
        No workout data yet.<br>Complete a session to see your stats.
      </div>`;
    return;
  }
  if (!curStatsGroup || !groupsWithData.includes(curStatsGroup)) curStatsGroup = groupsWithData[0];
  tab.innerHTML = `<div class="stats-hdr">Stats</div>
    <div class="select-wrap" style="margin-bottom:14px">
      <select id="statsGroupSel" onchange="curStatsGroup=this.value;renderStatsBody()">
        ${groupsWithData.map(g => `<option${g === curStatsGroup ? ' selected' : ''}>${esc(g)}</option>`).join('')}
      </select>
    </div>
    <div id="statsBody"></div>`;
  renderStatsBody();
}

function renderStatsBody() {
  const g = curStatsGroup;
  const exNames = new Set();
  workouts.forEach(w => {
    w.groups.forEach(wg => {
      if (wg.name === g) wg.exercises.forEach(e => { if (e.sets.some(s => s.completed)) exNames.add(e.name); });
    });
  });
  const exList = [...exNames];
  const body = document.getElementById('statsBody');
  if (!body) return;
  if (!exList.length) {
    body.innerHTML = `<div style="color:var(--text2);text-align:center;padding:40px 0;font-size:14px">No data logged for ${esc(g)}</div>`;
    return;
  }
  body.innerHTML = `<div class="select-wrap" style="margin-bottom:12px">
    <select id="statsExSel" onchange="renderExStats()">
      ${exList.map(e => `<option>${esc(e)}</option>`).join('')}
    </select>
  </div>
  <div id="exChartsArea"></div>
  <div id="summaryArea"></div>`;
  renderExStats();
  renderSummary(g, exList);
}

function renderExStats() {
  const sel = document.getElementById('statsExSel'); if (!sel) return;
  const exName = sel.value;
  const g = curStatsGroup;
  const sessions = [];
  workouts.forEach(w => {
    w.groups.forEach(wg => {
      if (wg.name !== g) return;
      const ex = wg.exercises.find(e => e.name.toLowerCase() === exName.toLowerCase());
      if (!ex) return;
      const done = ex.sets.filter(s => s.completed);
      if (!done.length) return;
      const avgR = done.reduce((a, x) => a + (x.reps   || 0), 0) / done.length;
      const avgW = done.reduce((a, x) => a + (x.weight || 0), 0) / done.length;
      sessions.push({ date: w.date, avgReps: Math.round(avgR * 10) / 10, avgWeight: Math.round(avgW * 10) / 10 });
    });
  });
  const area = document.getElementById('exChartsArea'); if (!area) return;
  if (!sessions.length) {
    area.innerHTML = '<div style="color:var(--text2);padding:16px 0;text-align:center;font-size:14px">No data logged</div>';
    return;
  }
  area.innerHTML = `<div class="chart-wrap"><div class="chart-ttl">Progress</div>${buildProgressChart(sessions)}</div>`;
}

// ── NEW PROGRESS CHART ──
// Straight lines + filled circles; weight label above, reps label below each point.
function buildProgressChart(sessions) {
  const PT_SPACING = 72; // min px between points
  const W = Math.max(280, sessions.length * PT_SPACING);
  const H = 180;
  const pad = { t: 38, r: 28, b: 38, l: 28 };
  const pw = W - pad.l - pad.r;
  const ph = H - pad.t - pad.b;
  const unit = settings.unit || 'lbs';

  // Y axis = avg weight
  const weights = sessions.map(s => s.avgWeight);
  const minW = Math.min(...weights), maxW = Math.max(...weights);
  const range = maxW - minW || 1;

  const pts = sessions.map((s, i) => ({
    x: pad.l + (sessions.length === 1 ? pw / 2 : i / (sessions.length - 1) * pw),
    y: pad.t + ph - (s.avgWeight - minW) / range * ph,
    w: s.avgWeight,
    r: s.avgReps,
    date: s.date
  }));

  // Straight line segments
  let lines = '';
  for (let i = 1; i < pts.length; i++) {
    lines += `<line x1="${pts[i-1].x.toFixed(1)}" y1="${pts[i-1].y.toFixed(1)}"
      x2="${pts[i].x.toFixed(1)}" y2="${pts[i].y.toFixed(1)}"
      stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>`;
  }

  // Circles + labels
  let marks = '';
  pts.forEach(p => {
    // filled circle
    marks += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="var(--accent)"/>`;
    // weight above circle
    marks += `<text x="${p.x.toFixed(1)}" y="${(p.y - 11).toFixed(1)}"
      text-anchor="middle" fill="var(--text)" font-size="10" font-weight="600">${p.w}${unit}</text>`;
    // reps below circle
    marks += `<text x="${p.x.toFixed(1)}" y="${(p.y + 19).toFixed(1)}"
      text-anchor="middle" fill="var(--text2)" font-size="10">${p.r} reps</text>`;
    // date at bottom
    marks += `<text x="${p.x.toFixed(1)}" y="${H - 4}"
      text-anchor="middle" fill="var(--text2)" font-size="9" opacity=".6">${p.date.slice(5)}</text>`;
  });

  return `<div class="chart-scroll">
    <svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${lines}${marks}</svg>
  </div>`;
}

function renderSummary(g, exList) {
  const area = document.getElementById('summaryArea'); if (!area) return;
  let h = `<div class="summary-table">
    <div style="font-weight:700;margin-bottom:10px;font-size:14px">${esc(g)} — All-time Averages</div>`;
  exList.forEach(exName => {
    let totalR = 0, totalW = 0, count = 0;
    workouts.forEach(w => {
      w.groups.forEach(wg => {
        if (wg.name !== g) return;
        const ex = wg.exercises.find(e => e.name.toLowerCase() === exName.toLowerCase());
        if (!ex) return;
        ex.sets.filter(s => s.completed).forEach(s => { totalR += (s.reps || 0); totalW += (s.weight || 0); count++; });
      });
    });
    const avgR = count ? Math.round(totalR / count * 10) / 10 : 0;
    const avgW = count ? Math.round(totalW / count * 10) / 10 : 0;
    h += `<div class="summary-row">
      <span>${esc(exName)}</span>
      <span style="color:var(--text2);font-size:13px">${avgR} reps · ${avgW} ${settings.unit || 'lbs'}</span>
    </div>`;
  });
  h += '</div>';
  area.innerHTML = h;
}

// ════════════════════════════════════════════
//  SETTINGS
// ════════════════════════════════════════════
function renderSettings() {
  const tab = document.getElementById('tab-settings');
  tab.innerHTML = `
    <div class="settings-hdr">Settings</div>
    <div class="settings-section">
      <div class="sec-label">Name</div>
      <input class="input" id="setName" value="${esc(settings.name || '')}" placeholder="Your name" autocomplete="given-name">
    </div>
    <div class="settings-section">
      <div class="sec-label">Units</div>
      <div class="unit-toggle">
        <button class="unit-btn${settings.unit === 'lbs' ? ' active' : ''}" data-unit="lbs" onclick="settingsUnit('lbs')">LBS</button>
        <button class="unit-btn${settings.unit === 'kg'  ? ' active' : ''}" data-unit="kg"  onclick="settingsUnit('kg')">KG</button>
      </div>
    </div>
    <div class="settings-section">
      <div class="sec-label">Default Rest</div>
      <div class="select-wrap">
        <select id="setRest" onchange="saveSettingsAuto()">
          ${REST_OPTIONS.map(r => `<option value="${r.label}"${(settings.defaultRest || '1min') === r.label ? ' selected' : ''}>${r.label}</option>`).join('')}
        </select>
      </div>
    </div>
    <button class="btn btn-accent" style="width:100%;margin-bottom:12px" onclick="saveSettingsAuto(true)">Save</button>
    <button style="width:100%;min-height:44px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--danger);color:var(--danger);background:none;cursor:pointer;letter-spacing:.1px" onclick="confirmReset()">Reset All Data</button>`;
}

function settingsUnit(u) {
  settings.unit = u;
  document.querySelectorAll('#tab-settings .unit-btn').forEach(b => b.classList.toggle('active', b.dataset.unit === u));
}
function saveSettingsAuto(showFeedback) {
  const nameEl = document.getElementById('setName');
  const restEl = document.getElementById('setRest');
  if (nameEl) settings.name        = nameEl.value.trim();
  if (restEl) settings.defaultRest = restEl.value;
  save('settings', settings);
  if (showFeedback) {
    const btn = document.querySelector('#tab-settings .btn-accent');
    if (btn) { btn.textContent = 'Saved'; btn.style.background = 'var(--c-sup)'; setTimeout(() => { btn.textContent = 'Save'; btn.style.background = ''; }, 1300); }
  }
}
function confirmReset() {
  if (confirm('This will erase ALL your data — workouts, exercises, settings. Are you sure?')) {
    localStorage.clear(); location.reload();
  }
}
